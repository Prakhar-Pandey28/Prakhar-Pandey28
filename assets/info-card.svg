<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210">
  <title>Prakhar Pandey — AI/ML Engineer</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
      .line { opacity: 0; }
      .k { fill: #8b8b95; }
      .v { fill: #f2f2f5; }
      .dim { fill: #8b8b95; }
    </style>
  </defs>

  <rect width="410" height="210" rx="14" fill="#0c0d10" stroke="#ffffff1f"/>

  <!-- terminal chrome -->
  <circle cx="24" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="24" r="5" fill="#febc2e"/>
  <circle cx="60" cy="24" r="5" fill="#28c840"/>
  <text x="205" y="28" text-anchor="middle" class="mono dim" font-size="11">prakhar@github ~ %</text>
  <line x1="0" y1="42" x2="410" y2="42" stroke="#ffffff1f"/>

  <g class="mono" font-size="12.5">
    <g class="line">
      <text x="20" y="70" class="k">Role</text>
      <text x="128" y="70" class="v">AI/ML Engineer</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
    </g>
    <g class="line">
      <text x="20" y="94" class="k">Location</text>
      <text x="128" y="94" class="v">Hyderabad, India</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    </g>
    <g class="line">
      <text x="20" y="118" class="k">Focus</text>
      <text x="128" y="118" class="v">RAG evaluation · distributed testing</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    </g>
    <g class="line">
      <text x="20" y="142" class="k">Stack</text>
      <text x="128" y="142" class="v">Python · FastAPI · LangChain · AWS</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
    </g>
    <g class="line">
      <text x="20" y="166" class="k">Approach</text>
      <text x="128" y="166" class="v">Evaluation-first engineering</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
    </g>
    <g class="line">
      <text x="20" y="190" class="k">Status</text>
      <circle cx="136" cy="186" r="3.5" fill="#34d399"/>
      <text x="146" y="190" class="v">Building agentic RAG systems</text>
      <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
    </g>
  </g>

  <circle cx="136" cy="186" r="3.5" fill="#34d399" opacity="0">
    <animate attributeName="opacity" from="0.4" to="1" begin="2.5s" dur="1.1s" repeatCount="indefinite" values="0.4;1;0.4" keyTimes="0;0.5;1"/>
  </circle>
</svg>
