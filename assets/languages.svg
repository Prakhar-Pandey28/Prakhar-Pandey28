<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190">
  <title>Prakhar Pandey — top languages by repository</title>
  <rect width="320" height="190" rx="14" fill="#0c0d10" stroke="#ffffff1f"/>
  <text x="20" y="34" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#8b8b95">Top languages</text>
  
    <text x="20" y="54" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#f2f2f5">JavaScript</text>
    <rect x="20" y="60" width="190" height="8" rx="4" fill="#ffffff14"/>
    <rect x="20" y="60" width="0" height="8" rx="4" fill="#8b7cff">
      <animate attributeName="width" from="0" to="53" begin="0.20s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="300" y="54" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#8b8b95">28%</text>
    <text x="20" y="80" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#f2f2f5">HTML</text>
    <rect x="20" y="86" width="190" height="8" rx="4" fill="#ffffff14"/>
    <rect x="20" y="86" width="0" height="8" rx="4" fill="#8b7cff">
      <animate attributeName="width" from="0" to="42" begin="0.35s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="300" y="80" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#8b8b95">22%</text>
    <text x="20" y="106" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#f2f2f5">Python</text>
    <rect x="20" y="112" width="190" height="8" rx="4" fill="#ffffff14"/>
    <rect x="20" y="112" width="0" height="8" rx="4" fill="#8b7cff">
      <animate attributeName="width" from="0" to="42" begin="0.50s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="300" y="106" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#8b8b95">22%</text>
    <text x="20" y="132" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#f2f2f5">CSS</text>
    <rect x="20" y="138" width="190" height="8" rx="4" fill="#ffffff14"/>
    <rect x="20" y="138" width="0" height="8" rx="4" fill="#8b7cff">
      <animate attributeName="width" from="0" to="21" begin="0.65s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="300" y="132" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#8b8b95">11%</text>
    <text x="20" y="158" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#f2f2f5">Jupyter Notebook</text>
    <rect x="20" y="164" width="190" height="8" rx="4" fill="#ffffff14"/>
    <rect x="20" y="164" width="0" height="8" rx="4" fill="#8b7cff">
      <animate attributeName="width" from="0" to="21" begin="0.80s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="300" y="158" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" fill="#8b8b95">11%</text>
</svg>
